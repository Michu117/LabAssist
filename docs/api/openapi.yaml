openapi: 3.0.3
info:
  title: API de LabAssist
  description: >
    API REST de los módulos de usuarios (MMR-01) y biometría (MMR-02) del sistema de registro de
    asistencia y gestión de laboratorios de computación de la Carrera de
    Computación de la UNL.
  version: 0.1.0

servers:
  - url: http://localhost:3000/api/v1

tags:
  - name: Salud
  - name: Autenticación
    description: Registro e inicio de sesión (públicos)
  - name: Perfil
    description: Consulta y edición del perfil propio
  - name: Usuarios
    description: Administración de usuarios por el Técnico Docente
  - name: Biometría
    description: Activación y recepción de capturas biométricas
  - name: Reservas
    description: Reserva de computadoras en sesiones manuales para estudiantes autenticados
  - name: Ocupación
    description: Plano y estadísticas de ocupación para el Técnico Docente
  - name: Laboratorios
    description: Alta de laboratorios y consulta de inventario para el Técnico Docente

security: []

paths:
  /salud:
    get:
      tags: [Salud]
      summary: Comprobación del estado del servicio
      responses:
        "200":
          description: Servicio en funcionamiento
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Exito"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          estado:
                            type: string
                            example: ok

  /biometria/capturas:
    post:
      tags: [Biometría]
      summary: Activar una captura biométrica
      security:
        - bearerAuth: []
      description: Un Técnico Docente solicita un slot en un lector disponible.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LectorBiometricoEntrada"
      responses:
        "201":
          description: Captura activada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Exito"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CapturaActivada"

        "409":
          description: Lector ocupado o sin slots disponibles
        "503":
          description: Lector o MQTT no disponible

  /biometria/capturas/{id}:
    get:
      tags: [Biometría]
      summary: Consultar el estado de una captura
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ParamCapturaId"
      responses:
        "200":
          description: Estado de la captura iniciada por el técnico autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exito"

        "404":
          description: Captura inexistente o de otro técnico

  /biometria/identificacion:
    post:
      tags: [Biometría]
      summary: Poner un lector en modo de identificación para asistencia
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LectorBiometricoEntrada"
      responses:
        "202":
          description: Orden publicada para la sesión activa del laboratorio del lector
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Exito"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [modo_id, dispositivo_id, vence_en]
                        properties:
                          modo_id:
                            type: string
                            pattern: '^[a-f0-9]{64}$'
                          dispositivo_id:
                            type: string
                          vence_en:
                            type: string
                            format: date-time
        "409":
          description: Sin sesión abierta con plazo vigente
        "503":
          description: Lector o MQTT no disponible

  /auth/registro:
    post:
      tags: [Autenticación]
      summary: Registrar un estudiante con captura biométrica (Técnico Docente)
      security:
        - bearerAuth: []
      description: Crea el usuario, su fila en estudiante, su cuenta temporal y su huella en una transacción.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistroEntrada"
      responses:
        "201":
          description: Estudiante registrado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Exito"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          usuario:
                            $ref: "#/components/schemas/UsuarioRegistro"
        "400":
          $ref: "#/components/responses/Validacion"
        "409":
          $ref: "#/components/responses/Conflicto"
        "500":
          $ref: "#/components/responses/Interno"

  /auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión con correo institucional y contraseña
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginEntrada"
      responses:
        "200":
          description: Sesión iniciada; el cierre se hace en el frontend eliminando el token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Exito"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [token, usuario]
                        properties:
                          token:
                            type: string
                            description: JWT que solo contiene `sub` y la expiración
                          usuario:
                            $ref: "#/components/schemas/UsuarioResumen"
        "400":
          $ref: "#/components/responses/Validacion"
        "401":
          $ref: "#/components/responses/Credenciales"
        "500":
          $ref: "#/components/responses/Interno"

  /usuarios/me:
    get:
      tags: [Perfil]
      summary: Consultar el perfil propio
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Perfil del usuario autenticado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Exito"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          usuario:
                            $ref: "#/components/schemas/Usuario"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "500":
          $ref: "#/components/responses/Interno"
    patch:
      tags: [Perfil]
      summary: Editar el perfil propio
      description: >
        Permite editar nombre, apellido y, si es estudiante, carrera y ciclo.
        No acepta correo, cédula, tipo ni huella.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditarPerfilEntrada"
      responses:
        "200":
          description: Perfil actualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Exito"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          usuario:
                            $ref: "#/components/schemas/Usuario"
        "400":
          $ref: "#/components/responses/Validacion"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "500":
          $ref: "#/components/responses/Interno"

  /usuarios/me/contrasena:
    patch:
      tags: [Perfil]
      summary: Cambiar la contraseña propia
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CambiarContrasenaEntrada"
      responses:
        "200":
          description: Contraseña actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exito"
        "400":
          $ref: "#/components/responses/Validacion"
        "401":
          description: Token ausente o inválido, o contraseña actual incorrecta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Interno"

  /usuarios:
    get:
      tags: [Usuarios]
      summary: Listar usuarios
      description: Requiere Técnico Docente. Acepta paginación, filtro por tipo y búsqueda.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ParamPagina"
        - $ref: "#/components/parameters/ParamLimite"
        - $ref: "#/components/parameters/ParamTipo"
        - $ref: "#/components/parameters/ParamBusqueda"
      responses:
        "200":
          description: Página de usuarios
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Exito"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [usuarios, total, pagina, limite]
                        properties:
                          usuarios:
                            type: array
                            items:
                              $ref: "#/components/schemas/Usuario"
                          total:
                            type: integer
                          pagina:
                            type: integer
                          limite:
                            type: integer
        "400":
          $ref: "#/components/responses/Validacion"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "500":
          $ref: "#/components/responses/Interno"
    post:
      tags: [Usuarios]
      summary: Crear un usuario Técnico Docente
      description: Requiere que ya exista al menos un Técnico Docente autenticado.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearTecnicoEntrada"
      responses:
        "201":
          description: Técnico Docente creado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Exito"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          usuario:
                            $ref: "#/components/schemas/Usuario"
        "400":
          $ref: "#/components/responses/Validacion"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "409":
          $ref: "#/components/responses/Conflicto"
        "500":
          $ref: "#/components/responses/Interno"

  /usuarios/{id}:
    parameters:
      - $ref: "#/components/parameters/ParamId"
    get:
      tags: [Usuarios]
      summary: Consultar un usuario
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usuario encontrado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Exito"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          usuario:
                            $ref: "#/components/schemas/Usuario"
        "400":
          $ref: "#/components/responses/Validacion"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "500":
          $ref: "#/components/responses/Interno"
    patch:
      tags: [Usuarios]
      summary: Editar un usuario
      description: >
        Permite editar nombre, apellido, cédula y correo (actualizando también
        cuenta.cuenta en la misma transacción) y, si es estudiante, carrera y
        ciclo. No permite cambiar el tipo de usuario ni la huella.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditarUsuarioEntrada"
      responses:
        "200":
          description: Usuario actualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Exito"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          usuario:
                            $ref: "#/components/schemas/Usuario"
        "400":
          $ref: "#/components/responses/Validacion"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/Conflicto"
        "500":
          $ref: "#/components/responses/Interno"
    delete:
      tags: [Usuarios]
      summary: Eliminar un usuario
      description: >
        Eliminación física en este avance. Un Técnico Docente no puede
        eliminar su propia cuenta.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usuario eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exito"
        "400":
          $ref: "#/components/responses/Validacion"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/Conflicto"
        "500":
          $ref: "#/components/responses/Interno"

  /reservas/sesiones:
    get:
      tags: [Reservas]
      security:
        - bearerAuth: []
      summary: Listar sesiones manuales abiertas de laboratorios habilitados
      description: En esta etapa el rol Estudiante sustituye temporalmente la asignación académica previa. El vínculo individual se guarda al reservar.
      responses:
        "200":
          description: Sesiones abiertas, con la ventana de reserva indicada en cada una
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, enum: [true] }
                  data:
                    type: object
                    required: [sesiones]
                    properties:
                      sesiones:
                        type: array
                        items:
                          $ref: "#/components/schemas/SesionReservable"
        "401":
          description: Token ausente o inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Solo estudiantes sin cambio obligatorio de contraseña
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /reservas/sesiones/{sesionId}/computadoras:
    get:
      tags: [Reservas]
      security:
        - bearerAuth: []
      summary: Consultar el inventario de una sesión manual abierta
      parameters:
        - name: sesionId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Inventario de la sesión sin datos del ocupante
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, enum: [true] }
                  data:
                    type: object
                    required: [computadoras, inventario]
                    properties:
                      computadoras:
                        type: array
                        description: Solo computadoras disponibles, en el formato original.
                        items:
                          $ref: "#/components/schemas/ComputadoraReservable"
                      inventario:
                        type: array
                        items:
                          $ref: "#/components/schemas/ComputadoraInventarioReserva"
        "400":
          description: Identificador inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Token ausente o inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Solo estudiantes sin cambio obligatorio de contraseña
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Sesión inexistente, cerrada o de un laboratorio deshabilitado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /reservas:
    post:
      tags: [Reservas]
      security:
        - bearerAuth: []
      summary: Reservar una computadora
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sesionId, computadoraId]
              additionalProperties: false
              properties:
                sesionId: { type: integer, minimum: 1 }
                computadoraId: { type: integer, minimum: 1 }
      responses:
        "201":
          description: Reserva confirmada
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, enum: [true] }
                  data:
                    $ref: "#/components/schemas/ReservaPc"
        "200":
          description: La misma reserva ya estaba confirmada
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, enum: [true] }
                  data:
                    $ref: "#/components/schemas/ReservaPc"
        "400":
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Token ausente o inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Solo estudiantes sin cambio obligatorio de contraseña
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Sesión inaccesible o computadora fuera del laboratorio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Sesión cerrada, computadora no disponible o reserva vigente incompatible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /reservas/me/activa:
    get:
      tags: [Reservas]
      security:
        - bearerAuth: []
      summary: Consultar la reserva activa de la cuenta autenticada
      responses:
        "200":
          description: Reserva vigente o data nulo
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, enum: [true] }
                  data:
                    $ref: "#/components/schemas/ReservaPcActiva"
        "401":
          description: Token ausente o inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Solo estudiantes sin cambio obligatorio de contraseña
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /ocupacion/laboratorios:
    get:
      tags: [Ocupación]
      security:
        - bearerAuth: []
      summary: Listar laboratorios con inventario consultable
      responses:
        "200":
          description: Laboratorios registrados
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, enum: [true] }
                  data:
                    $ref: "#/components/schemas/LaboratoriosOcupacion"
        "401":
          description: JWT ausente o inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Se requiere el rol Técnico Docente y completar el cambio obligatorio de contraseña
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /ocupacion/laboratorios/{laboratorioId}:
    get:
      tags: [Ocupación]
      security:
        - bearerAuth: []
      summary: Consultar la distribución y las estadísticas del laboratorio
      parameters:
        - name: laboratorioId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Plano, estadísticas y auditoría de sesión sin datos de estudiantes
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, enum: [true] }
                  data:
                    $ref: "#/components/schemas/PlanoOcupacion"
        "400":
          description: Identificador inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: JWT ausente o inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Se requiere el rol Técnico Docente y completar el cambio obligatorio de contraseña
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Laboratorio inexistente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /ocupacion/laboratorios/{laboratorioId}/sesiones:
    post:
      tags: [Ocupación]
      security:
        - bearerAuth: []
      summary: Activar un laboratorio y abrir su sesión manual en una transacción
      parameters:
        - name: laboratorioId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "201":
          description: Sesión abierta
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, enum: [true] }
                  data:
                    type: object
                    required: [sesion]
                    properties:
                      sesion:
                        $ref: "#/components/schemas/SesionManual"
        "400":
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: JWT ausente o inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Se requiere el rol Técnico Docente y completar cualquier cambio obligatorio de contraseña
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Laboratorio inexistente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Laboratorio con sesión abierta, sin PCs operativas o con actividad incompatible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /ocupacion/laboratorios/{laboratorioId}/sesiones/{sesionId}/finalizar:
    post:
      tags: [Ocupación]
      security:
        - bearerAuth: []
      summary: Desactivar el laboratorio, finalizar su sesión manual y conservar el historial
      parameters:
        - name: laboratorioId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: sesionId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                desocupado:
                  type: boolean
                  default: false
                  description: Confirmación obligatoria si hay ocupaciones vigentes.
      responses:
        "200":
          description: Sesión finalizada
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, enum: [true] }
                  data:
                    type: object
                    required: [sesion]
                    properties:
                      sesion:
                        $ref: "#/components/schemas/SesionManual"
        "400":
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: JWT ausente o inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Se requiere el rol Técnico Docente y completar cualquier cambio obligatorio de contraseña
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Sesión manual inexistente en el laboratorio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Sesión ya finalizada o confirmación de laboratorio desocupado requerida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /ocupacion/laboratorios/{laboratorioId}/computadoras/{computadoraId}/ocupante:
    get:
      tags: [Ocupación]
      security:
        - bearerAuth: []
      summary: Consultar el estudiante en una PC con asistencia confirmada
      parameters:
        - name: laboratorioId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: computadoraId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Detalle de la ocupación vigente
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, enum: [true] }
                  data:
                    $ref: "#/components/schemas/OcupanteLaboratorio"
        "400":
          description: Identificador inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: JWT ausente o inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Se requiere el rol Técnico Docente y completar el cambio obligatorio de contraseña
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Computadora inexistente en el laboratorio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Computadora sin ocupación confirmada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /laboratorios:
    get:
      tags: [Laboratorios]
      security:
        - bearerAuth: []
      summary: Listar laboratorios y contar sus computadoras
      responses:
        "200":
          description: Laboratorios registrados
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, enum: [true] }
                  data:
                    $ref: "#/components/schemas/ListadoLaboratorios"
        "401":
          description: JWT ausente o inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Se requiere el rol Técnico Docente y completar el cambio obligatorio de contraseña
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [Laboratorios]
      security:
        - bearerAuth: []
      summary: Crear un laboratorio y sus computadoras en una sola transacción
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AltaLaboratorio"
      responses:
        "201":
          description: Laboratorio e inventario creados
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, enum: [true] }
                  data:
                    $ref: "#/components/schemas/LaboratorioCreado"
        "400":
          description: Campos obligatorios o valores inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: JWT ausente o inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Se requiere el rol Técnico Docente y completar el cambio obligatorio de contraseña
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Código de laboratorio duplicado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /laboratorios/{laboratorioId}/computadoras:
    get:
      tags: [Laboratorios]
      security:
        - bearerAuth: []
      summary: Consultar las computadoras de un laboratorio en orden numérico de código
      parameters:
        - name: laboratorioId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Laboratorio e inventario
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, enum: [true] }
                  data:
                    $ref: "#/components/schemas/InventarioLaboratorio"
        "400":
          description: Identificador inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: JWT ausente o inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Se requiere el rol Técnico Docente y completar el cambio obligatorio de contraseña
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Laboratorio inexistente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Token devuelto por `POST /auth/login`. Encabezado: `Authorization: Bearer <token>`"

  parameters:
    ParamId:
      name: id
      in: path
      required: true
      description: Identificador numérico del usuario
      schema:
        type: integer
        minimum: 1
    ParamPagina:
      name: pagina
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    ParamLimite:
      name: limite
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ParamTipo:
      name: tipo
      in: query
      required: false
      description: Filtra por el tipo de usuario, derivado de la tabla en la que existe
      schema:
        $ref: "#/components/schemas/TipoUsuario"
    ParamBusqueda:
      name: busqueda
      in: query
      required: false
      description: Coincidencia parcial sobre nombre, apellido, cédula o correo
      schema:
        type: string
        maxLength: 150
    ParamCapturaId:
      name: id
      in: path
      required: true
      description: Identificador de la sesión de captura
      schema:
        type: string
        pattern: "^[a-f0-9]{64}$"

  schemas:
    AltaLaboratorio:
      type: object
      required: [codigo, nombre, cantidad_computadoras]
      additionalProperties: false
      properties:
        codigo:
          type: string
          maxLength: 30
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,29}$'
          description: Código único que se guarda en mayúsculas. La API recorta los espacios de los extremos.
        nombre: { type: string, minLength: 1, maxLength: 100 }
        cantidad_computadoras: { type: integer, minimum: 1, maximum: 999 }

    LaboratorioGestion:
      type: object
      required: [id, codigo, nombre, cantidad_computadoras]
      properties:
        id: { type: integer }
        codigo:
          type: string
          nullable: true
          description: Solo los laboratorios anteriores al alta por esta API pueden carecer de código.
        nombre: { type: string }
        cantidad_computadoras: { type: integer, minimum: 0 }

    LaboratorioCreado:
      type: object
      required: [laboratorio]
      properties:
        laboratorio:
          $ref: "#/components/schemas/LaboratorioGestion"

    ListadoLaboratorios:
      type: object
      required: [laboratorios]
      properties:
        laboratorios:
          type: array
          items:
            $ref: "#/components/schemas/LaboratorioGestion"

    InventarioLaboratorio:
      type: object
      required: [laboratorio, computadoras]
      properties:
        laboratorio:
          $ref: "#/components/schemas/LaboratorioGestion"
        computadoras:
          type: array
          items:
            type: object
            required: [id, codigo_pc, estado_fisico]
            properties:
              id: { type: integer }
              codigo_pc: { type: string }
              estado_fisico: { type: string, enum: [NORMAL, DAÑADA] }

    LaboratorioOcupacion:
      type: object
      required: [id, nombre, ubicacion]
      properties:
        id: { type: integer }
        nombre: { type: string }
        ubicacion: { type: string, nullable: true }

    LaboratoriosOcupacion:
      type: object
      required: [laboratorios]
      properties:
        laboratorios:
          type: array
          items:
            $ref: "#/components/schemas/LaboratorioOcupacion"

    EquipoOcupacion:
      type: object
      required: [id, codigo_pc, fila, columna, estado, estado_fisico]
      properties:
        id: { type: integer }
        codigo_pc: { type: string }
        fila: { type: integer, minimum: 1, nullable: true }
        columna: { type: integer, minimum: 1, nullable: true }
        estado: { type: string, enum: [Disponible, Reservada, Ocupada, Inactiva] }
        estado_fisico: { type: string, enum: [NORMAL, DAÑADA] }

    PlanoOcupacion:
      type: object
      required: [laboratorio, sesion, computadoras, asistencia_integrada, estadisticas]
      properties:
        laboratorio:
          allOf:
            - $ref: "#/components/schemas/LaboratorioOcupacion"
            - type: object
              required: [habilitado]
              properties:
                habilitado:
                  type: boolean
                  description: La activación y la desactivación actualizan este valor junto con la sesión manual.
        sesion:
          description: Sesión abierta o última sesión manual, si existe.
          anyOf:
            - $ref: "#/components/schemas/SesionManual"
            - type: object
              nullable: true
              enum: [null]
        computadoras:
          type: array
          items:
            $ref: "#/components/schemas/EquipoOcupacion"
        asistencia_integrada:
          type: boolean
          description: Indica si está disponible el flujo real de confirmación de asistencia.
        estadisticas:
          type: object
          required: [total, disponibles, reservadas, ocupadas, inactivas, presentes, porcentaje_ocupacion]
          properties:
            total: { type: integer, minimum: 0 }
            disponibles: { type: integer, minimum: 0 }
            reservadas: { type: integer, minimum: 0 }
            ocupadas:
              type: integer
              minimum: 0
              description: Equipos con confirmación vigente registrada.
            inactivas: { type: integer, minimum: 0 }
            presentes:
              type: integer
              minimum: 0
              nullable: true
              description: Nulo mientras la asistencia esté pendiente de integración.
            porcentaje_ocupacion:
              type: number
              minimum: 0
              maximum: 100
              nullable: true
              description: Nulo mientras la asistencia esté pendiente de integración.

    OcupanteLaboratorio:
      type: object
      required: [nombre, apellido, identificacion, ingreso_en]
      properties:
        nombre: { type: string }
        apellido: { type: string }
        identificacion: { type: string }
        ingreso_en: { type: string, format: date-time }

    SesionManual:
      type: object
      required: [id, laboratorio_id, estado, inicio, fin, abierta_por_id, abierta_por_nombre, finalizada_por_id, finalizada_por_nombre]
      properties:
        id: { type: integer }
        laboratorio_id: { type: integer }
        estado: { type: string, enum: [ABIERTA, FINALIZADA] }
        inicio: { type: string, format: date-time }
        fin: { type: string, format: date-time, nullable: true }
        abierta_por_id: { type: integer }
        abierta_por_nombre: { type: string }
        finalizada_por_id: { type: integer, nullable: true }
        finalizada_por_nombre: { type: string, nullable: true }

    SesionReservable:
      type: object
      required: [id, laboratorio, laboratorio_codigo, cantidad_computadoras, cantidad_disponibles, estado, inicio, fin, admite_reservas, vence_reserva_en]
      properties:
        id: { type: integer }
        laboratorio: { type: string }
        laboratorio_codigo: { type: string, nullable: true }
        cantidad_computadoras: { type: integer, minimum: 0 }
        cantidad_disponibles: { type: integer, minimum: 0 }
        estado: { type: string, enum: [ABIERTA] }
        inicio: { type: string, format: date-time }
        fin: { type: string, format: date-time, nullable: true }
        admite_reservas: { type: boolean }
        vence_reserva_en: { type: string, format: date-time }

    ComputadoraReservable:
      type: object
      required: [id, codigo_pc]
      properties:
        id: { type: integer }
        codigo_pc: { type: string }

    ComputadoraInventarioReserva:
      type: object
      required: [id, codigo_pc, estado]
      properties:
        id: { type: integer }
        codigo_pc: { type: string }
        estado: { type: string, enum: [Disponible, Reservada, Ocupada, Inactiva] }

    ReservaPc:
      type: object
      required: [id, sesion_id, computadora_id, codigo_pc, laboratorio, inicio, creada_en, vence_en, estado_pc]
      properties:
        id: { type: integer }
        sesion_id: { type: integer }
        computadora_id: { type: integer }
        codigo_pc: { type: string }
        laboratorio: { type: string }
        inicio: { type: string, format: date-time }
        creada_en: { type: string, format: date-time }
        vence_en: { type: string, format: date-time }
        estado_pc: { type: string, enum: [Reservada, Ocupada] }

    ReservaPcActiva:
      anyOf:
        - allOf:
            - $ref: "#/components/schemas/ReservaPc"
            - type: object
              required: [hora_servidor]
              properties:
                hora_servidor: { type: string, format: date-time }
        - type: object
          nullable: true
          enum: [null]

    TipoUsuario:
      type: string
      enum: [ESTUDIANTE, TECNICO_DOCENTE]
      description: No existe una columna rol; el tipo se deriva de las tablas estudiante y tecnico_docente

    Exito:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          example: true
        data:
          type: object

    Error:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          example: false
        error:
          type: object
          required: [codigo, mensaje, detalles]
          properties:
            codigo:
              type: string
              enum:
                - VALIDACION
                - CONFLICTO
                - CREDENCIALES
                - AUTENTICACION
                - PROHIBIDO
                - NO_ENCONTRADO
                - CAPTURA_INVALIDA
                - CAMBIO_CONTRASENA_OBLIGATORIO
                - INTERNO
            mensaje:
              type: string
            detalles:
              type: array
              items:
                type: object
                properties:
                  campo:
                    type: string
                  mensaje:
                    type: string

    UsuarioResumen:
      type: object
      required: [id, nombre, apellido, correo, tipo]
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
        apellido:
          type: string
        correo:
          type: string
        tipo:
          $ref: "#/components/schemas/TipoUsuario"

    Usuario:
      allOf:
        - $ref: "#/components/schemas/UsuarioResumen"
        - type: object
          required: [cedula]
          properties:
            cedula:
              type: string
              pattern: "^[0-9]{10}$"
              description: Cédula ecuatoriana válida (provincia y dígito verificador)
            carrera:
              type: string
              description: Solo presente en estudiantes
            ciclo:
              type: string
              description: Solo presente en estudiantes

    UsuarioRegistro:
      allOf:
        - $ref: "#/components/schemas/Usuario"
        - type: object
          required: [contrasena_temporal]
          properties:
            contrasena_temporal:
              type: string
              description: Contraseña generada por el servidor para el primer acceso

    LectorBiometricoEntrada:
      type: object
      additionalProperties: false
      properties:
        dispositivo_id:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,100}$'

    CapturaActivada:
      type: object
      required: [captura_id, estado, dispositivo_id, slot, expira_en]
      properties:
        captura_id:
          type: string
        estado:
          type: string
          enum: [PENDIENTE]
        dispositivo_id:
          type: string
        slot:
          type: integer
          minimum: 1
          maximum: 65535
        expira_en:
          type: string
          format: date-time

    RegistroEntrada:
      type: object
      additionalProperties: false
      required:
        - nombre
        - apellido
        - cedula
        - correo
        - carrera
        - ciclo
        - captura_id
      properties:
        nombre:
          type: string
          maxLength: 100
        apellido:
          type: string
          maxLength: 100
        cedula:
          type: string
          pattern: "^[0-9]{10}$"
        correo:
          type: string
          format: email
          description: Convertido a minúsculas y debe terminar en @unl.edu.ec
          example: ana.perez@unl.edu.ec
        carrera:
          type: string
          maxLength: 100
        ciclo:
          type: string
          maxLength: 20
        captura_id:
          type: string
          pattern: "^[a-f0-9]{64}$"

    LoginEntrada:
      type: object
      additionalProperties: false
      required: [correo, contrasena]
      properties:
        correo:
          type: string
          format: email
          example: ana.perez@unl.edu.ec
        contrasena:
          type: string
          minLength: 8
          maxLength: 72

    EditarPerfilEntrada:
      type: object
      additionalProperties: false
      description: No acepta correo, cédula, tipo ni huella
      properties:
        nombre:
          type: string
          maxLength: 100
        apellido:
          type: string
          maxLength: 100
        carrera:
          type: string
          maxLength: 100
          description: Solo si el usuario es estudiante
        ciclo:
          type: string
          maxLength: 20
          description: Solo si el usuario es estudiante

    CambiarContrasenaEntrada:
      type: object
      additionalProperties: false
      required: [contrasena_actual, contrasena, confirmar_contrasena]
      properties:
        contrasena_actual:
          type: string
          minLength: 8
          maxLength: 72
        contrasena:
          type: string
          minLength: 8
          maxLength: 72
        confirmar_contrasena:
          type: string
          minLength: 8
          maxLength: 72

    CrearTecnicoEntrada:
      type: object
      additionalProperties: false
      required:
        - nombre
        - apellido
        - cedula
        - correo
        - contrasena
        - confirmar_contrasena
      properties:
        nombre:
          type: string
          maxLength: 100
        apellido:
          type: string
          maxLength: 100
        cedula:
          type: string
          pattern: "^[0-9]{10}$"
        correo:
          type: string
          format: email
          example: tecnico@unl.edu.ec
        contrasena:
          type: string
          minLength: 8
          maxLength: 72
        confirmar_contrasena:
          type: string
          minLength: 8
          maxLength: 72

    EditarUsuarioEntrada:
      type: object
      additionalProperties: false
      description: No acepta tipo ni huella; la clave solo cambia por /usuarios/me/contrasena
      properties:
        nombre:
          type: string
          maxLength: 100
        apellido:
          type: string
          maxLength: 100
        cedula:
          type: string
          pattern: "^[0-9]{10}$"
        correo:
          type: string
          format: email
          description: Se actualiza también cuenta.cuenta en la misma transacción
        carrera:
          type: string
          maxLength: 100
          description: Solo si el usuario es estudiante
        ciclo:
          type: string
          maxLength: 20
          description: Solo si el usuario es estudiante

  responses:
    Validacion:
      description: Datos inválidos o campos no permitidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NoAutorizado:
      description: Token ausente o inválido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Credenciales:
      description: Credenciales de acceso inválidas (mensaje exacto de HU-01)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Prohibido:
      description: Autenticado sin permiso (usuario que no es Técnico Docente)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NoEncontrado:
      description: Usuario no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflicto:
      description: Cédula o correo duplicados, o intento de eliminar la cuenta propia
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Interno:
      description: Error interno sin detalles técnicos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
