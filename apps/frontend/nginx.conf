server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  # React Router: cualquier ruta que no sea un archivo se resuelve en
  # index.html para que la aplicación funcione al recargar la página.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
